[tools]
node = "latest"
pnpm = "latest"
python = "3.13.3"
uv = "latest"

# --- AI Tools (Example based) ---
"npm:@anthropic-ai/claude-code" = "latest"
"npm:czg" = "latest"

# --- Recommended TUI Utils ---
neovim = "latest"
lazygit = "latest"
ripgrep = "latest"
fd = "latest"
fzf = "latest"
delta = "latest"
starship = "latest"
yazi = "latest"
"aqua:rossmacarthur/sheldon" = "latest"
zoxide = "latest"
deno = "latest"
eza = "latest"
bat = "latest"
zig = "0.15.2"
shellcheck = "latest"
"aqua:charmbracelet/glow" = "latest"
"aqua:muesli/duf" = "latest"
hyperfine = "latest"
"aqua:dalance/procs" = "latest"
"aqua:bootandy/dust" = "latest"
# --- Modern Shell UX ---
# atuin: シェル履歴DB (Ctrl+R)。difftastic: 構文差分 (git dft / lazygit)
# television: 高速fuzzyランチャー (tv)。carapace: 1000+コマンドの補完 (fzf-tab経由で表示)
atuin = "latest"
# aquaレジストリの資産名が古く失敗するため github バックエンドで取得
"github:Wilfred/difftastic" = { version = "latest", bin = "difft" }
television = "latest"
carapace = "latest"
# fastfetch: Ubuntu 22.04のapt標準リポジトリに無いためmiseで統一管理する
# (Arch/Omarchyでは既にOmarchy本体が提供するが、mise版がPATH優先されても実害はない)
"aqua:fastfetch-cli/fastfetch" = "latest"

[settings]
experimental = true
asdf_compat = true
idiomatic_version_file_enable_tools = ["node"]

[settings.upgrade]
auto_prune = false

[env]
# --- Editor Settings ---
EDITOR = "nvim"
VISUAL = "nvim"

# --- Common CLI Tools Settings ---
# AWS CLI の出力を WezTerm のスクロールバックに直接流す (ページャー無効化)
AWS_PAGER = ""
# BAT_THEME は generate-cli-theme が生成する cli-theme.zsh 側で管理 (ansi = Omarchyパレット追従)

# --- Locale & i18n ---
# C.UTF-8 はモダンな Linux で必ず利用できる、英語ベースかつ Unicode 対応の安全なロケールです
LANG = "C.UTF-8"
LC_ALL = "C.UTF-8"

[tasks]
# --- Maintenance ---
# 全ツールの更新を一括実行
update = { run = "omarchy update", description = "Update Omarchy and system packages" }
update-tools = { run = "mise upgrade && mise run lock", description = "Update mise tools and refresh the lockfile" }
lock = { run = "MISE_CONFIG_DIR=~/dotfiles/mise/.config/mise mise lock --global --platform linux-x64,linux-x64-musl", description = "Refresh the mise lockfile for Omarchy" }
doctor = { run = "cd ~/dotfiles && ./scripts/dotfiles-doctor", description = "Validate the complete dotfiles setup" }
parity = { run = "cd ~/dotfiles && ./tests/quattro-parity/run", description = "Check the Omarchy 4 (Quattro) port against the 3.x baseline" }
apply = { run = "cd ~/dotfiles && ./scripts/apply-dotfiles", description = "Reapply all Stow packages" }
apply-ubuntu = { run = "cd ~/dotfiles && ./scripts/apply-dotfiles-ubuntu", description = "Reapply the Ubuntu/Debian Stow subset (no Hyprland/Waybar/Omarchy)" }
apply-profile = { run = "cd ~/dotfiles && ./scripts/apply-host-profile", description = "Apply this host's monitor profile" }
install-spurs = { run = "cd ~/dotfiles && ./scripts/install-spurs-theme", description = "Install the custom Spurs Omarchy theme" }
setup-signing = { run = "cd ~/dotfiles && ./scripts/setup-git-signing", description = "Enable git commit signing via 1Password SSH agent" }
build-theme = { run = "cd ~/dotfiles && python3 -B tools/build_theme.py themes/spurs", description = "Regenerate Spurs theme files from colors.toml" }

# --- Shortcut Commands ---
# 対話式conventional commits (カレントリポジトリで実行)
commit = { run = "czg", description = "Conventional commit prompt (czg)" }
# どこにいてもドットファイルのリポジトリで Lazygit を起動
dot = { run = "cd ~/dotfiles && lazygit", description = "Management dotfiles repo with lazygit" }
# WezTerm の設定を即座に開く
wez = { run = "nvim ~/dotfiles/wezterm/.config/wezterm/wezterm.lua", description = "Edit WezTerm config" }
# mise の設定を即座に開く
config = { run = "nvim ~/dotfiles/mise/.config/mise/config.toml", description = "Edit global mise config" }

# --- External Tool Bridges ---
# Claude Code をプロジェクトディレクトリ等で起動する例
ai = { run = "claude", description = "Launch Claude Code AI assistant" }
