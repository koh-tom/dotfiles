# Google Chrome 起動フラグ (Arch の google-chrome ラッパーが読む。行頭#はコメント)
# Wayland ネイティブで動かす (タッチパッドジェスチャを受け取るのに必要)
--ozone-platform=wayland
# 2本指の左右スワイプで戻る/進む (Mac風)
--enable-features=TouchpadOverscrollHistoryNavigation,OverlayScrollbar
--load-extension=/usr/share/omarchy/default/chromium/extensions/yt-dlp,/usr/share/omarchy/default/chromium/extensions/whatsapp-slim
--password-store=gnome-libsecret
