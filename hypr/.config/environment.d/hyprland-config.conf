# Hyprland に設定ファイルを明示する (uwsm 経由の systemd user 環境で読まれる)
# ~/.config/hypr/hyprland.lua が存在しても無視され、.conf (Omarchy 構成) が常に使われる。
# 背景: Hyprland 0.56 は .lua を .conf より優先し、0.57 で .conf サポートが削除された。
#       Omarchy が Lua 対応するまで hyprland は 0.56.2 に固定 (/etc/pacman.conf IgnorePkg)。
HYPRLAND_CONFIG=${HOME}/.config/hypr/hyprland.conf
