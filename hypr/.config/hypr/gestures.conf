# トラックパッドジェスチャ (dotfiles管理。~/.config/hypr/hyprland.conf から source)
# Mac風: 3本指の左右スワイプでワークスペース切替 (指に追従してスライド)
# 書式は Hyprland 0.51+ の gesture キーワード: https://wiki.hyprland.org/Configuring/Gestures/
gesture = 3, horizontal, workspace

gestures {
  # 端のワークスペースを越えてスワイプしても空のワークスペースを作らない
  workspace_swipe_create_new = false
}
