# 定型文プリセット (dotfiles管理。~/.config/hypr/hyprland.conf から source)
# SUPER+V の履歴 (cliphist) とは別枠。処理は ~/dotfiles/scripts/clip-presets
# 中身は git 管理外の ~/.local/share/clip-presets/ に保存される

bindd = SUPER ALT, V, Clipboard presets, exec, ~/dotfiles/scripts/clip-presets
bindd = SUPER ALT, C, Save clipboard as preset, exec, ~/dotfiles/scripts/clip-presets save
bindd = SUPER ALT SHIFT, C, Delete clipboard preset, exec, ~/dotfiles/scripts/clip-presets delete
