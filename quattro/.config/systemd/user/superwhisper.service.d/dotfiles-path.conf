# Superwhisper は補助スクリプト (scripts/*.py) を PATH 上の `python3` で動かし、GTK4/AT-SPI の
# Python バインディング (python-gobject) を import する。systemd --user の PATH は mise の shims が
# /usr/bin より前にあるため、mise の Python (gi 無し) が選ばれて `superwhisper doctor` が
# "desktop Python bindings" で ERROR になる。サービスだけシステムの python3 を先に見せる。
# (dotfiles: quattro/.config/systemd/user/superwhisper.service.d/)
[Service]
Environment=PATH=/usr/share/omarchy/bin:%h/.local/bin:/usr/local/bin:/usr/bin
