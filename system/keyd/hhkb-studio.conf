# HHKB Studio (日本語配列) を ThinkPad X13 Gen1 (日本語配列) と同じ物理配置にする
# 適用: ./scripts/install-keyd  (/etc/keyd/ へ配置して keyd reload)
#
# 両機の evdev を記録して突き合わせた結果、違うのは下の4箇所だけ。
# ◇/Alt/無変換/Space/変換/かな/Alt/矢印、記号キーは同じコードを送るので触らない。
# HHKBの [Fn] はキーボード内部で処理されOSに届かないため、ここでは変えられない。

[ids]
# HHKB-Studio (Bluetooth / USB 共通)。同じIDのポインティングスティックは掴まない
k:04fe:0015

[main]
# 左上 [Esc]: ThinkPadでは 半角/全角
esc = grave
# Aの左 [Control]: ThinkPadでは Caps (Hyprland の compose:caps で Compose になる)
leftcontrol = capslock
# 最下段の左から2番目 [半角/全角]: ThinkPadでは Ctrl
grave = layer(control)
# [Fn]+[Esc] (本来は電源): ThinkPadで 半角/全角 の真上 (Fn段) にある Esc
power = esc
