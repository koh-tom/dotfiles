# Claude Code の母艦 (常時起動のマシン) の tmux 設定。scripts/claude-hub setup が母艦へ配る。
# 普段の tmux とぶつからないよう、claude-hub は専用のソケット (-L hub) でこの設定を読む。
#   prefix は既定の Ctrl+b (手元の WezTerm の LEADER は Ctrl+q なので重ならない)

# 端末: 色・Shift+Enter (Claude の改行)・通知の素通し
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,wezterm:RGB,xterm*:extkeys"
set -g extended-keys on
set -g allow-passthrough on
set -g focus-events on
set -g set-clipboard on
set -sg escape-time 10

# 操作
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# ウィンドウ名はいる場所 (プロジェクト名)
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# 端末のタイトル: 手元の WezTerm は「󰚩 」で始まるタイトルを母艦のタブとして色分けする (wezterm/tab.lua)
set -g set-titles on
set -g set-titles-string "󰚩 #W"

# 見た目: 下に細い1行。左端に「母艦」の札 (端末の紫 = テーマの color5) を出して手元と見分ける
set -g status-position bottom
set -g status-style "bg=default,fg=colour244"
set -g status-left "#[bg=colour5,fg=colour0,bold] 󰚩 母艦 #[default] "
set -g status-left-length 20
set -g status-right "#[fg=colour244]%H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=colour5,bold] #I #W "
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour5"
set -g message-style "bg=default,fg=colour5"

# prefix + C: ディレクトリを聞いて、そこで新しい Claude を開く
bind C command-prompt -p "dir:" { new-window -c "%1" "exec zsh -ic '~/.local/bin/claude; exec zsh -i'" }
# prefix + r: 設定の読み直し
bind r source-file "$HOME/.config/dotfiles/claude-hub-tmux.conf" \; display "reloaded"
