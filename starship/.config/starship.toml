add_newline = true

# ----------------------------------------------------
# format
# ----------------------------------------------------
format = """
${custom.directory}\
$git_branch\
$git_status\
${custom.push_personal}${custom.push_lab}\
$nix_shell\
$python\
$aws\
$fill\
$cmd_duration\
$time\
\n$character\
"""

[fill]
symbol = "·"
style = "fg:#45475a" # Surface1

[directory]
disabled = true

[custom.directory]
command = "bash ~/.config/zsh/scripts/starship_directory.sh"
when = "true"
format = "$output"

[git_branch]
symbol = ""
style = "bold fg:#cba6f7 bg:#313244" # Mauve on Surface0
format = "[](fg:#313244)[$symbol $branch ]($style)"

[git_status]
style = "bold fg:#f38ba8 bg:#313244" # Red on Surface0
format = "[$all_status$ahead_behind]($style)[](fg:#313244) "

[cmd_duration]
min_time = 2000
style = 'fg:#fab387' # Peach
format = "[](fg:#fab387)[󱎫 $duration](fg:#11111b bg:#fab387)[](fg:#fab387) "

[time]
disabled = false
time_format = "%R"
format = "[](fg:#313244)[ $time](fg:#89b4fa bg:#313244)[](fg:#313244)"

[character]
vimcmd_symbol = '[V](bold green) '

# push認証を常時表示 (ghpushで切替)。personal=緑 / lab=赤。値で色を変えるため2モジュール構成
[custom.push_personal]
when = '[ "$GH_PUSH_AS" != lab ]'
command = "echo personal"
format = "[](fg:#a6e3a1)[ push:$output ]($style)[](fg:#a6e3a1) "
style = "bold fg:#11111b bg:#a6e3a1"

[custom.push_lab]
when = '[ "$GH_PUSH_AS" = lab ]'
command = "echo lab"
format = "[](fg:#f38ba8)[ push:$output ]($style)[](fg:#f38ba8) "
style = "bold fg:#11111b bg:#f38ba8"


[nix_shell]
symbol = "❄ "
format = "[](fg:#94e2d5)[$symbol$name ]($style)[](fg:#94e2d5) "
style = "bold fg:#11111b bg:#94e2d5" # Crust on Teal

[aws]
format = '[$symbol $profile ]($style)'
symbol = "💭"
style = "bold fg:#ffcb6b"
